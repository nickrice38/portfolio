          </div>

        <p>Hi, I'm Nick Rice.</p>
        <p>I'm a product designer based in London, UK.</p>
        <p>I'm currently Director of Product Design at <span class="text-highlight">Fanatics</span>, building out a new sports prediction market.</p>
        <p>I previously designed products at <span class="text-highlight">MoonPay</span> &amp; <span class="text-highlight">Starling</span>, and worked with early-stage startups such as <span class="text-highlight">Searchable</span>, <span class="text-highlight">Lottie</span> &amp; <span class="text-highlight">Luna</span>.</p>
      </div>
